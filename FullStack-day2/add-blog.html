<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Blog</title>
</head>
<body>
  <header>
    <nav>
      <h1>My Blog</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="add-blog.html">Add Blog</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Add a New Blog Post</h2>
      <p>Fill out the form below to create a new blog post.</p>

      <form action="#" method="post">
        <div>
          <label for="title">Blog Title</label>
          <input type="text" id="title" name="title" placeholder="Enter blog title" required>
        </div>

        <div>
          <label for="author">Author Name</label>
          <input type="text" id="author" name="author" placeholder="Enter author name" required>
        </div>

        <div>
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="technology">Technology</option>
            <option value="education">Education</option>
            <option value="lifestyle">Lifestyle</option>
            <option value="travel">Travel</option>
          </select>
        </div>

        <div>
          <label for="summary">Short Summary</label>
          <input type="text" id="summary" name="summary" placeholder="Enter a short summary">
        </div>

        <div>
          <label for="content">Blog Content</label>
          <textarea id="content" name="content" rows="8" placeholder="Write your blog content here" required></textarea>
        </div>

        <div>
          <button type="submit">Submit Blog</button>
          <button type="reset">Clear Form</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Blog. All rights reserved.</p>
  </footer>
</body>
</html>
